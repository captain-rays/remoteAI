name: RemoteAI

options:
  bundleIdPrefix: live.jaco
  projectFormat: "xcode15_3"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"

packages:
  RemoteAI:
    path: .

settings:
  base:
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  # The application target contributes only the @main entry point; every other
  # source file lives in the RemoteAIKit package so it can be built and tested
  # without a simulator.
  RemoteAI:
    type: application
    platform: iOS
    sources:
      - path: RemoteAI/App/RemoteAIApp.swift
      - path: RemoteAI/Assets.xcassets
    dependencies:
      - package: RemoteAI
        product: RemoteAIKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.jaco.remoteai
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: P5QXSVF4WP
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # A download is written into the app's Documents folder. Without these
        # two keys that folder is invisible to the Files app, so the file
        # arrives on the phone and nothing can reach it.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_CFBundleDisplayName: RemoteAI
        INFOPLIST_KEY_NSCameraUsageDescription: >-
          RemoteAI uses the camera once, to scan the pairing code shown on your Mac.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight

  # Bridges the SwiftPM suites into XCTest. The suite bodies are shared, not
  # duplicated: this bundle contains one file that runs RemoteAISuites.
  RemoteAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RemoteAIXCTests
    dependencies:
      - target: RemoteAI
      - package: RemoteAI
        product: RemoteAISuites
      - package: RemoteAI
        product: RemoteAITestKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.jaco.remoteai.tests
        GENERATE_INFOPLIST_FILE: YES

  RemoteAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RemoteAIUITests
    dependencies:
      - target: RemoteAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.jaco.remoteai.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RemoteAI:
    build:
      targets:
        RemoteAI: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RemoteAITests
        - RemoteAIUITests
